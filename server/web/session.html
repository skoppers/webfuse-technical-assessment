<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session · Webfuse Activity Analyzer</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1><a href="/">Webfuse Activity Analyzer</a></h1>
      <span class="muted">/ session</span>
      <span class="spacer"></span>
      <span class="conn" id="conn" data-state="connecting" hidden>connecting</span>
    </header>
    <main>
      <div class="detail-head" id="head"></div>

      <div class="grid">
        <aside class="panel" id="meter">
          <h3>Live meter</h3>
          <div class="rate"><span class="n">0</span><span class="unit">events / 10s</span></div>
          <div class="bar"><div></div></div>
          <dl class="counters"></dl>
          <h3 style="margin-top:14px">Last 5</h3>
          <ul class="recent"></ul>
        </aside>

        <section class="panel">
          <div class="controls" id="controls" hidden>
            <button id="toStart" title="Skip to beginning">⏮</button>
            <button id="play" title="Play / pause">▶ Play</button>
            <button id="toEnd" title="Skip to end">⏭</button>
            <input type="range" class="scrubber" id="scrubber" min="0" max="0" value="0" step="1" />
            <span class="clock" id="clock"></span>
          </div>
          <h3 id="feedTitle">Event feed</h3>
          <ul class="feed" id="feed"></ul>
          <p class="empty" id="feedEmpty">Waiting for events…</p>
        </section>
      </div>
    </main>

    <script type="module">
      import {
        api, subscribe, createMeter, renderMeter, badge, statusPill, esc,
        shortId, duration, dateTime, clockTime, formatEventLabel, isKey, bindConnState,
      } from "/app.js";

      const $ = (id) => document.getElementById(id);
      const id = new URLSearchParams(location.search).get("id");

      const feed = $("feed");
      const feedEmpty = $("feedEmpty");
      const MAX_FEED = 500;
      let session = null;

      // ---- shared rendering -------------------------------------------------

      function renderHead() {
        const s = session;
        const now = Date.now();
        $("head").innerHTML = `
          <h2 class="mono" title="${esc(s.session_id)}">${esc(shortId(s.session_id))}</h2>
          ${statusPill(s.status)}
          <dl>
            <div><dt>space</dt><dd class="mono">${esc(s.space_id)}</dd></div>
            <div><dt>started</dt><dd>${esc(dateTime(s.started_at))}</dd></div>
            <div><dt>duration</dt><dd class="mono">${esc(duration(s.started_at, s.ended_at ?? now))}</dd></div>
            <div><dt>participants</dt><dd>${s.participant_count}</dd></div>
            <div><dt>source</dt><dd>${esc(s.source)}</dd></div>
          </dl>`;
        document.title = `${shortId(s.session_id)} · Webfuse Activity Analyzer`;
      }

      function feedRow(e) {
        const li = document.createElement("li");
        if (isKey(e.type)) li.className = "key";
        li.innerHTML = `
          <span class="seq mono">#${e.seq}</span>
          <span class="mono muted">${esc(clockTime(e.ts))}</span>
          ${badge(e.type)}
          <span class="label mono">${esc(formatEventLabel(e))}</span>`;
        return li;
      }

      function appendToFeed(e) {
        feedEmpty.hidden = true;
        const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
        feed.appendChild(feedRow(e));
        while (feed.children.length > MAX_FEED) feed.removeChild(feed.firstChild);
        if (atBottom) feed.scrollTop = feed.scrollHeight;
      }

      function clearFeed() {
        feed.innerHTML = "";
        feedEmpty.hidden = false;
      }

      // ---- live mode ----------------------------------------------------------

      let closeStream = null;
      let liveTicker = null;

      // The per-session stream has no history, so a page opened mid-session
      // backfills from the log first. Stream frames that arrive while the
      // backfill is in flight are held and applied after it, deduped on seq.
      async function startLive() {
        $("controls").hidden = true;
        $("conn").hidden = false;
        $("feedTitle").textContent = "Live feed";
        const meter = createMeter();
        const seen = new Set();
        let pending = [];
        const tick = () => renderMeter($("meter"), meter.snapshot());
        tick();

        const apply = (a) => {
          if (seen.has(a.seq)) return;
          seen.add(a.seq);
          meter.add(a, a.ts);
          appendToFeed(a);
        };

        closeStream = subscribe(`/stream/${encodeURIComponent(id)}`, {
          onState: bindConnState($("conn")),
          onSession(s) {
            // The stream payload lacks source/metadata; keep them from the API read.
            session = { ...session, ...s };
            renderHead();
            if (s.status === "ended") switchToReplay();
          },
          onActivity(a) {
            if (pending) { pending.push(a); return; }
            apply(a);
            tick();
          },
          onReconnect: async () => {
            try {
              session = await api.session(id);
              renderHead();
              if (session.status === "ended") switchToReplay();
            } catch (err) { console.error(err); }
          },
        });
        liveTicker = setInterval(() => { tick(); renderHead(); }, 1000);

        try {
          for (const e of await api.events(id)) apply(e);
        } catch (err) {
          console.error("backfill", err);
        }
        const held = pending;
        pending = null;
        for (const a of held) apply(a);
        tick();
      }

      function stopLive() {
        closeStream?.(); closeStream = null;
        clearInterval(liveTicker); liveTicker = null;
        $("conn").hidden = true;
      }

      async function switchToReplay() {
        stopLive();
        await startReplay();
      }

      // ---- replay mode --------------------------------------------------------

      // The timeline is indexed by event count: position n means the first n
      // events have been applied. Playback is paced by client-ts deltas between
      // consecutive events, with idle gaps capped so quiet stretches don't
      // stall. Seeking rebuilds the meter and feed from scratch, which is cheap
      // at the sizes a session log reaches.
      const MAX_GAP_MS = 3000;

      async function startReplay() {
        $("feedTitle").textContent = "Replay";
        $("controls").hidden = false;
        clearFeed();
        feedEmpty.textContent = "Loading log…";

        const playBtn = $("play");
        const toStartBtn = $("toStart");
        const toEndBtn = $("toEnd");
        const scrubber = $("scrubber");
        const clock = $("clock");
        const setEnabled = (on) => { for (const el of [playBtn, toStartBtn, toEndBtn, scrubber]) el.disabled = !on; };
        setEnabled(false);

        let events;
        try {
          events = await api.events(id);
        } catch (err) {
          feedEmpty.textContent = `Could not load events: ${err.message}`;
          return;
        }
        if (events.length === 0) {
          feedEmpty.textContent = "This session recorded no events.";
          renderMeter($("meter"), createMeter().snapshot());
          return;
        }

        const n = events.length;
        const first = events[0].ts;
        let meter = createMeter();
        let pos = 0;             // events applied so far
        let virtualNow = first;
        let timer = null;
        let playing = false;

        scrubber.max = String(n);

        const gapAfter = (idx) => Math.min(Math.max(events[idx + 1].ts - events[idx].ts, 0), MAX_GAP_MS);

        const renderControls = () => {
          clock.textContent = `${clockTime(virtualNow)} · ${pos}/${n}`;
          scrubber.value = String(pos);
          playBtn.textContent = playing ? "❚❚ Pause" : pos >= n ? "↺ Replay" : "▶ Play";
          toStartBtn.disabled = pos === 0;
          toEndBtn.disabled = pos >= n;
        };

        // seek rebuilds state so that exactly `target` events are applied.
        const seek = (target) => {
          target = Math.max(0, Math.min(n, target | 0));
          meter = createMeter();
          for (let k = 0; k < target; k++) meter.add(events[k], events[k].ts);
          pos = target;
          virtualNow = pos === 0 ? first : events[pos - 1].ts;

          feed.innerHTML = "";
          const frag = document.createDocumentFragment();
          for (let k = Math.max(0, pos - MAX_FEED); k < pos; k++) frag.appendChild(feedRow(events[k]));
          feed.appendChild(frag);
          feedEmpty.hidden = pos > 0;
          feedEmpty.textContent = "Press play to replay the session.";
          feed.scrollTop = feed.scrollHeight;

          renderMeter($("meter"), meter.snapshot(virtualNow));
          renderControls();
        };

        const stopTimer = () => { clearTimeout(timer); timer = null; };

        const step = () => {
          const e = events[pos++];
          virtualNow = e.ts;
          meter.add(e, e.ts);
          appendToFeed(e);
          renderMeter($("meter"), meter.snapshot(virtualNow));
          if (pos >= n) { playing = false; timer = null; renderControls(); return; }
          renderControls();
          timer = setTimeout(step, gapAfter(pos - 1));
        };

        const schedule = () => {
          stopTimer();
          const gap = pos === 0 ? 0 : gapAfter(pos - 1);
          timer = setTimeout(step, gap);
        };

        const play = () => {
          if (pos >= n) seek(0);
          playing = true;
          renderControls();
          schedule();
        };

        const pause = () => {
          playing = false;
          stopTimer();
          renderControls();
        };

        playBtn.onclick = () => (playing ? pause() : play());
        toStartBtn.onclick = () => { pause(); seek(0); };
        toEndBtn.onclick = () => { pause(); seek(n); };
        scrubber.oninput = () => {
          const wasPlaying = playing;
          stopTimer();
          seek(Number(scrubber.value));
          if (wasPlaying && pos < n) schedule();
          else if (wasPlaying) { playing = false; renderControls(); }
        };

        setEnabled(true);
        seek(n);   // open paused, with the whole log on screen
      }

      // ---- boot ------------------------------------------------------------------

      async function main() {
        if (!id) {
          $("head").innerHTML = `<h2>No session id</h2><p><a href="/">Back to sessions</a></p>`;
          return;
        }
        try {
          session = await api.session(id);
        } catch (err) {
          $("head").innerHTML = err.status === 404
            ? `<h2>Session not found</h2><p><a href="/">Back to sessions</a></p>`
            : `<h2>Error loading session</h2><p class="muted">${esc(err.message)}</p>`;
          return;
        }
        renderHead();
        if (session.status === "live") await startLive();
        else await startReplay();
      }
      main();
    </script>
  </body>
</html>
